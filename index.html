<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GK Quiz by Rohit</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
</head>

<body>

  <div class="particles" id="particles"></div>

  <div class="welcome-page" id="welcomePage">
    <div class="welcome-card">
      <div class="welcome-logo">🧠</div>
      <div class="welcome-badge">10 Interesting Questions</div>
      <h1>GK QUIZ</h1>
      <h2>By Rohit</h2>
      <p>10 मजेदार सवाल • 8 सही करके दिखाओ 🧠🔥</p>
      <div class="space-hint">Press SPACE to Start</div>
      <button onclick="startQuiz()" class="start-btn">Start Quiz ▶</button>
    </div>
  </div>

  <div class="quiz-box" id="quizBox" style="display:none;">

    <div class="header">
      <div class="logo">🧠 GK Quiz by Rohit</div>
      <div class="count" id="count">Question 1/10</div>
    </div>

    <div class="question-page" id="questionPage">
      <div class="question" id="question"></div>

      <div class="timer-box" id="timerBox">
        <span id="timer"></span>
      </div>

      <div class="options">
        <div class="option" id="optionA"></div>
        <div class="option" id="optionB"></div>
        <div class="option" id="optionC"></div>
        <div class="option" id="optionD"></div>
      </div>
    </div>

    <div class="answer-page" id="answerPage">
      <div class="big-answer" id="answer"></div>

      <div class="big-explanation">
        <strong>📘 Explanation</strong>
        <p id="explanation"></p>
      </div>

      <div class="big-fact">
        <strong>💡 Interesting Fact</strong>
        <p id="fact"></p>
      </div>
    </div>

    <div class="controls">
      <button class="show-btn" onclick="startCountdown()">Show Answer</button>
      <button class="next-btn" onclick="nextQuestion()">Next Question</button>
    </div>
    <!-- End Page -->
<div class="end-page" id="endPage">
  <div class="end-icon">🏆</div>

  <h1>Quiz Complete!</h1>

  <p>आपके 10 में से कितने जवाब सही हुए?</p>

  <div class="comment-text">
    अपना Score Comment में जरूर बताएं 👇
  </div>

  <div class="end-brand">
    🧠 GK Quiz by Rohit
  </div>
</div>

  </div>

  <script src="questions.js"></script>
  <script src="script.js"></script>

  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js");
      });
    }
  </script>

</body>
</html>
